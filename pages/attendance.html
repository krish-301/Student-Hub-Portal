<!DOCTYPE html>
<html>
<head>
    <title>Student Attendance Portal</title>
</head>

<body  style="background-color: rgb(209, 229, 246)">

    <h1 align="center" style="background-color: rgb(11, 22, 230); color : white; padding : 10px">Student Attendance Portal</h1>
    <hr>

    <h2 align="center"  style="background-color: rgb(72, 59, 250); color:rgb(247, 243, 243); padding:10px">Student Information</h2>

    <table border="1" cellpadding="10">

        <tr>
            <td><b>Student Name</b></td>
            <td><input type="text" placeholder="Enter Name"></td>
        </tr>

        <tr>
            <td><b>Enrollment ID</b></td>
            <td><input type="text" placeholder="Enter ID"></td>
        </tr>

        <tr>
            <td><b>Branch</b></td>
            <td>
                <select>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Mechanical</option>
                    <option>Electrical</option>
                    <option>Civil</option>
                </select>
            </td>
        </tr>

        <tr>
            <td><b>Semester</b></td>
            <td>
                <select>
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                </select>
            </td>
        </tr>

    </table>

    <br>

    <h2>Attendance Record</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>Subject</th>
            <th>Total Classes</th>
            <th>Classes Attended</th>
            <th>Attendance %</th>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>40</td>
            <td>36</td>
            <td>90%</td>
        </tr>

        <tr>
            <td>Programming</td>
            <td>45</td>
            <td>40</td>
            <td>89%</td>
        </tr>

        <tr>
            <td>Database</td>
            <td>38</td>
            <td>35</td>
            <td>92%</td>
        </tr>

        <tr>
            <td>Web Technology</td>
            <td>42</td>
            <td>39</td>
            <td>93%</td>
        </tr>

    </table>

    <br>

    <input type="button" value="Check Attendance">
    <input type="reset" value="Clear">

    <hr>

    <p align="center">
        © 2025 Student Attendance Portal
    </p>

</body>
</html>

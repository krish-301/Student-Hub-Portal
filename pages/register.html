<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body  style="background-color: rgb(209, 229, 246)">

    <h1 align="center"  style="background-color: blue; color:rgb(247, 243, 243); padding:10px">Student Portal</h1>
    <hr>

    <h2 align="center"  style="background-color: rgb(72, 59, 250); color:rgb(247, 243, 243); padding:10px">Student Registration Form</h2>

    <form>

        <table align="center" cellpadding="8">

            <tr>
                <td>Full Name</td>
                <td><input type="text" placeholder="Enter your full name"></td>
            </tr>

            <tr>
                <td>Enrollment ID</td>
                <td><input type="text" placeholder="Enter enrollment ID"></td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input type="email" placeholder="Enter email"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Enter password"></td>
            </tr>

            <tr>
                <td>Confirm Password</td>
                <td><input type="password" placeholder="Confirm password"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <input type="radio" name="gender"> Other
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Branch</td>
                <td>
                    <select>
                        <option>Select Branch</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Electronics</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Semester</td>
                <td>
                    <select>
                        <option>Select Semester</option>
                        <option>Semester 1</option>
                        <option>Semester 2</option>
                        <option>Semester 3</option>
                        <option>Semester 4</option>
                        <option>Semester 5</option>
                        <option>Semester 6</option>
                        <option>Semester 7</option>
                        <option>Semester 8</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Mobile Number</td>
                <td><input type="tel" placeholder="Enter mobile number"></td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea rows="4" cols="25" placeholder="Enter address"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    Already have an account?
                    <a href="login.html">Login Here</a>
                </td>
            </tr>

        </table>

    </form>

    <hr>

    <p align="center"  >
        © 2025 Student Portal. All Rights Reserved.
    </p>

</body>
</html>
